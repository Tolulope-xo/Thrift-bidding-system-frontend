<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1ea" />
    <title>ThriftBid — Every thing has a second story</title>
    <meta name="description" content="ThriftBid — live auctions for pre-loved clothing, furniture, electronics and books. Bid in real time, sell in minutes." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ThriftBid" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="ThriftBid — Every thing has a second story" />
    <meta property="og:description" content="ThriftBid — live auctions for pre-loved clothing, furniture, electronics and books. Bid in real time, sell in minutes." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ThriftBid — live auctions for pre-loved clothing, furniture, electronics and books" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ThriftBid — Every thing has a second story" />
    <meta name="twitter:description" content="ThriftBid — live auctions for pre-loved clothing, furniture, electronics and books. Bid in real time, sell in minutes." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="ThriftBid — live auctions for pre-loved clothing, furniture, electronics and books" />

    <!-- Site-wide structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "ThriftBid",
            "description": "Live auctions for pre-loved clothing, furniture, electronics and books. Bid in real time, sell in minutes.",
            "inLanguage": "en",
            "publisher": { "@id": "%SITE_URL%/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": { "@type": "EntryPoint", "urlTemplate": "%SITE_URL%/browse?search={search_term_string}" },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "OnlineStore",
            "@id": "%SITE_URL%/#organization",
            "name": "ThriftBid",
            "url": "%SITE_URL%/",
            "logo": "%SITE_URL%/favicon.svg",
            "image": "%SITE_URL%/og-image.png",
            "slogan": "Every thing has a second story",
            "description": "Live auction marketplace for pre-loved clothing, furniture, electronics and books with real-time bidding.",
            "currenciesAccepted": "USD"
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
